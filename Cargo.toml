[package]
name = "sacct-parse"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Parse Slurm sacct --parsable2 rows into typed records. It does not run sacct or decide which jobs matter."
repository = "https://github.com/Volt-Labs-Technology/sacct-parse"
homepage = "https://github.com/Volt-Labs-Technology/sacct-parse"
documentation = "https://docs.rs/sacct-parse"
readme = "README.md"
license = "MIT"
keywords = ["slurm", "sacct", "hpc", "parser"]
categories = ["parser-implementations", "science"]

[dependencies]
thiserror = "1"
